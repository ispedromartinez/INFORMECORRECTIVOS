<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ICETEL – Selección de Proyecto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1F3B;
  --bg:#F6F7FB;
  --tigo:#0073EA;
  --tigo-2:#1976D2;
  --wom:#4A0E8F;
  --wom-2:#3A0A6E;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Poppins',system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
}
a,button{touch-action:manipulation;}

/* ── HEADER ── */
header{
  width:100%;
  background:var(--ink);
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 16px rgba(0,0,0,.25);
}
.hdr-tagline{color:rgba(255,255,255,.5);font-size:12px;font-weight:500;letter-spacing:.2px;}

/* ── HERO ── */
.hero{
  width:100%;
  background:linear-gradient(135deg,#1C1F3B 0%,#2D3060 55%,#3B2070 100%);
  padding:52px 24px 60px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero-orb1{
  position:absolute;width:420px;height:420px;
  background:rgba(97,97,255,.12);border-radius:50%;
  top:-120px;left:-120px;pointer-events:none;
}
.hero-orb2{
  position:absolute;width:320px;height:320px;
  background:rgba(0,115,234,.1);border-radius:50%;
  bottom:-100px;right:-80px;pointer-events:none;
}
.hero h1{
  font-size:28px;font-weight:800;color:#fff;
  letter-spacing:-.4px;margin-bottom:10px;
  position:relative;z-index:1;
}
.hero p{
  font-size:13px;font-weight:400;color:rgba(255,255,255,.58);
  position:relative;z-index:1;
}

/* ── MAIN ── */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px 52px;
  width:100%;
  max-width:860px;
}

.section-label{
  font-size:11px;font-weight:600;color:#676879;
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:20px;align-self:flex-start;
}

/* ── CARDS ── */
.cards{
  display:flex;
  gap:24px;
  width:100%;
  justify-content:center;
  flex-wrap:wrap;
}

.card{
  flex:1 1 260px;
  max-width:320px;
  background:#fff;
  border-radius:18px;
  display:flex;
  flex-direction:column;
  box-shadow:0 2px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  cursor:pointer;
  text-decoration:none;
  transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .25s;
  position:relative;
  overflow:hidden;
  border:1.5px solid #E8EAED;
  /* entrada escalonada */
  opacity:0;
  transform:translateY(14px);
  animation:cardIn .5s var(--ease-out) forwards;
}
.card.tigo{animation-delay:.06s;}
.card.wom{animation-delay:.14s;}
@keyframes cardIn{to{opacity:1;transform:translateY(0);}}

@media(hover:hover) and (pointer:fine){
  .card:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 48px rgba(0,0,0,.16),0 6px 16px rgba(0,0,0,.07);
    border-color:transparent;
  }
  .card:hover .card-banner-logo{transform:scale(1.04);}
  .card:hover .card-arrow{transform:translateX(3px);}
}
.card:active{transform:translateY(-2px) scale(.99);}
.card:focus-visible{
  outline:none;
  border-color:transparent;
  box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ring),0 14px 40px rgba(0,0,0,.14);
}
.card.tigo{--ring:var(--tigo);}
.card.wom{--ring:var(--wom);}

/* Banner de marca */
.card-banner{
  width:100%;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.card.tigo .card-banner{background:var(--tigo);}
.card.wom .card-banner{background:var(--wom);}
.card-banner-logo{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s var(--ease-out);
}
.card-banner-logo img{
  max-height:46px;max-width:170px;object-fit:contain;
  /* logo azul de Tigo → blanco sobre el banner */
  filter:brightness(0) invert(1);
}
.wom-text{
  font-size:42px;font-weight:900;color:#fff;letter-spacing:-2.5px;line-height:1;font-style:italic;
}

/* Cuerpo */
.card-inner{
  display:flex;flex-direction:column;align-items:center;
  gap:9px;padding:24px 28px 4px;width:100%;
}
.card-label{
  font-size:13px;font-weight:700;color:#323338;letter-spacing:.4px;text-transform:uppercase;
}
.card-desc{
  font-size:12.5px;font-weight:400;color:#676879;text-align:center;line-height:1.6;
}

.card-btn{
  width:calc(100% - 56px);
  margin:18px 28px 28px;
  padding:12px 24px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:600;font-family:'Poppins',sans-serif;
  border:none;cursor:pointer;
  color:#fff;
  transition:filter .15s, box-shadow .2s var(--ease-out);
  letter-spacing:.1px;
}
.card.tigo .card-btn{background:var(--tigo);box-shadow:0 6px 16px rgba(0,115,234,.32);}
.card.wom .card-btn{background:var(--wom);box-shadow:0 6px 16px rgba(74,14,143,.34);}
.card:hover .card-btn{filter:brightness(1.06);}
.card-arrow{transition:transform .3s var(--ease-out);font-size:15px;line-height:1;}

/* ── FOOTER ── */
footer{
  padding:20px;
  color:#5a6573;
  font-size:11px;
  font-weight:400;
  text-align:center;
  background:var(--bg);
  width:100%;
  border-top:1px solid #E8EAED;
}

@media(max-width:480px){
  .hero{padding:36px 20px 42px;}
  .hero h1{font-size:22px;}
  main{padding:26px 16px 36px;}
  .cards{gap:16px;}
  .card{max-width:none;}
  .card-btn{font-size:13px;min-height:46px;}
  footer{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
}
@media(prefers-reduced-motion:reduce){
  .card{animation:none;opacity:1;transform:none;}
  *{transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<header>
  <span class="hdr-tagline">Sistema de Gestión de Informes</span>
</header>

<div class="hero">
  <div class="hero-orb1"></div>
  <div class="hero-orb2"></div>
  <h1>Seleccione el Proyecto</h1>
  <p>Elija el cliente para ingresar al módulo correspondiente</p>
</div>

<main>
  <div class="cards">

    <!-- TIGO -->
    <a href="/tigo" class="card tigo">
      <div class="card-banner">
        <div class="card-banner-logo">
          <img src="tigo-logo.png" alt="Tigo">
        </div>
      </div>
      <div class="card-inner">
        <span class="card-label">Proyecto TIGO</span>
        <span class="card-desc">Informes correctivos<br>de equipos de clima</span>
      </div>
      <button class="card-btn" tabindex="-1">Ingresar <span class="card-arrow">→</span></button>
    </a>

    <!-- WOM -->
    <a href="/wom" class="card wom">
      <div class="card-banner">
        <div class="card-banner-logo">
          <span class="wom-text">wom</span>
        </div>
      </div>
      <div class="card-inner">
        <span class="card-label">Proyecto WOM</span>
        <span class="card-desc">Informes correctivos<br>de equipos de clima</span>
      </div>
      <button class="card-btn" tabindex="-1">Ingresar <span class="card-arrow">→</span></button>
    </a>

  </div>
</main>

<footer>Sistema de Gestión de Informes / Control y Gestión</footer>

</body>
</html>
